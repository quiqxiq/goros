# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  # Job integration dijalankan manual/terjadwal (device lab tidak selalu online)
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'  # Minggu 02:00 UTC

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.x'

    - name: Check out code
      uses: actions/checkout@v4

    - name: Cache go mod
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-

    - name: golangci-lint
      with: { version: latest }
      uses: golangci/golangci-lint-action@v4
    
    - name: dump dependencies (for nancy)
      run: go list -json -m all > go.list

    - name: Nancy (deps vulnerabilities)
      uses: sonatype-nexus-community/nancy-github-action@main
  build:
    name: build
    runs-on: ubuntu-latest
    needs: lint
    strategy: { matrix: { go: [ '1.22.x', '1.23.x'] } }
    steps:
    - name: Setup go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}
              
    - name: Check out code
      uses: actions/checkout@v4
      with: { fetch-depth: 0 } 
      
    - name: Cache go mod
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-    
      
    - name: Test
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Build listen example
      run: go build -v ./examples/listen/

    - name: Build run example
      run: go build -v ./examples/run/

    - name: Build tab example
      run: go build -v ./examples/tab/
  # Integration test ke device RouterOS nyata (build tag `integration`, D-009).
  # Kredensial hanya dari secrets; manual/terjadwal agar pipeline utama tidak
  # gagal saat lab offline.
  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    env:
      ROUTEROS_TEST_ADDRESS: ${{ secrets.ROUTEROS_TEST_ADDRESS }}
      ROUTEROS_TEST_USERNAME: ${{ secrets.ROUTEROS_TEST_USERNAME }}
      ROUTEROS_TEST_PASSWORD: ${{ secrets.ROUTEROS_TEST_PASSWORD }}
      ROUTEROS_TEST_SSH_ADDRESS: ${{ secrets.ROUTEROS_TEST_SSH_ADDRESS }}
      ROUTEROS_TEST_SSH_USERNAME: ${{ secrets.ROUTEROS_TEST_SSH_USERNAME }}
      ROUTEROS_TEST_SSH_PASSWORD: ${{ secrets.ROUTEROS_TEST_SSH_PASSWORD }}
    steps:
    - name: Setup go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.x'

    - name: Check out code
      uses: actions/checkout@v4
      with: { fetch-depth: 0 }

    - name: Cache go mod
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-

    - name: Integration test (native-api + ssh + gate)
      run: go test -tags integration -count=1 -timeout 300s ./transport/nativeapi/ ./transport/ssh/ ./gate/ .

